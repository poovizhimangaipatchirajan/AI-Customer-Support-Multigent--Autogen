
name: fixflow-ai

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: backend/Dockerfile

  env_file:
    - .env

  environment:
    FIXFLOW_DB: /app/data/fixflow.sqlite3
    FIXFLOW_EVIDENCE_DIR: /app/data/private_evidence
    FIXFLOW_CUSTOMER_INDEX_MODE: approved_only

  volumes:
    - ./docker_data/app:/app/data
    - ./docker_data/local_index:/app/local_index
    - ./local_customer_index:/app/local_customer_index:ro

  restart: unless-stopped

  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *backend-common

    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *backend-common

    command:
      - python
      - -m
      - backend.worker.main

    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    environment:
      FIXFLOW_API_URL: http://api:8000

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "127.0.0.1:8501:8501"

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
